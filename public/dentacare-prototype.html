<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>DentaCare</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--navy:#0f2a5c;--blue:#1d4ed8;--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--soft:#e0e9fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
.split{display:flex;min-height:100vh}.split .pan{width:26%;background:var(--navy);color:#fff;padding:28px;font-weight:700;letter-spacing:.08em}
.split .pan p{font-weight:400;letter-spacing:0;color:#cbd5e1;font-size:13px;margin-top:8px}
.split .ct{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--card)}
.ct>div{width:100%;max-width:760px}
.app{display:flex;min-height:100vh}
aside{width:200px;background:var(--navy);color:#fff;padding:20px 12px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.acct{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.15);cursor:pointer}.acct .pic{width:40px;height:40px;border-radius:50%;background:#a5c0f5 center/cover;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}.acct b{display:block;font-size:13px;letter-spacing:0}.acct small{color:#cbd5e1;font-size:11px}.acct div{min-width:0}.acct b,.acct small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside h1{font-size:15px;letter-spacing:.08em;margin:0 8px 20px}
aside a{display:block;padding:9px 10px;border-radius:7px;color:#cbd5e1;cursor:pointer;margin-bottom:3px;font-size:13px}
aside a.on{background:var(--blue);color:#fff}aside a:hover{background:rgba(255,255,255,.1)}
.tb{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:12px;flex-wrap:wrap}
.tb b{letter-spacing:.08em}.tb nav{display:flex;gap:18px;align-items:center;font-size:13px}.tb nav a{cursor:pointer;color:#dbe4f5}.tb nav a.on{color:#fff;font-weight:700;text-decoration:underline}
.av{width:30px;height:30px;border-radius:50%;background:#a5c0f5;color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:700;cursor:pointer}
main{flex:1;padding:24px;min-width:0}.pg{max-width:1000px;margin:0 auto;padding:24px}
h2{margin:0;font-size:24px}.sub{color:var(--mu);font-size:12px;margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}.grid .card{margin:0}
.big{font-size:30px;font-weight:700;color:var(--blue)}
.hero{background:linear-gradient(135deg,#1d4ed8,#0f2a5c);color:#fff;border-radius:12px;padding:20px}
.hero small{font-size:11px;letter-spacing:.06em;opacity:.85}.hero h3{margin:8px 0 16px;font-size:22px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}.two.e{grid-template-columns:1fr 1fr}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:460px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);font-size:13px}th{color:var(--mu);font-weight:500;font-size:12px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:12px}
.btn.o{background:transparent;color:var(--blue);border:1px solid var(--blue)}.btn.w{background:#fff;color:var(--navy)}.btn.g{background:transparent;color:#fff;border:1px solid #fff}
.btn.s{padding:5px 10px}.btn.f{width:100%}.btn.cta{padding:11px 18px;font-size:13px;background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(29,78,216,.4);white-space:nowrap}.plus{color:#9db4e8;font-size:18px;line-height:1.6;display:block;text-align:center}.cal td:hover .plus{color:var(--blue)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--soft);color:var(--blue)}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}
label{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:7px;background:var(--card);color:var(--tx);font:inherit}
input[type=range]{padding:0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.tabs{display:flex;border:1px solid var(--ln);border-radius:7px;overflow:hidden;margin-bottom:14px}.tabs button{flex:1;border:0;padding:8px;background:var(--card);color:var(--tx);font-size:12px;cursor:pointer}.tabs button.on{background:var(--soft);color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:5px 12px;border-radius:99px;font-size:12px;cursor:pointer}.chip.on{background:var(--soft);border-color:var(--blue);color:var(--blue)}
.bar{height:9px;background:var(--ln);border-radius:9px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--blue)}
.cols{display:flex;align-items:flex-end;gap:10px;height:140px;margin:30px 0 24px}.cols em{position:absolute;top:-19px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;font-weight:700}.cols div{flex:1;background:var(--blue);border-radius:5px 5px 0 0;position:relative}
.cols span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
.ch{position:relative;height:170px;margin:26px 0 30px 28px}.yl i{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ln)}.yl em{position:absolute;left:-26px;top:-8px;width:18px;text-align:right;font-style:normal;font-size:11px;color:var(--mu)}.cols2{position:absolute;inset:0;display:flex;align-items:flex-end;gap:14px;padding:0 10px}.cols2 .b{flex:1;background:var(--blue);border-radius:5px 5px 0 0;position:relative;min-height:2px}.cols2 u{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;text-decoration:none}.cols2 span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
input[type=date],input[type=time]{color:#000;color-scheme:light}input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:brightness(0);opacity:1;cursor:pointer;width:18px;height:18px}
.chart{display:flex;gap:8px;height:170px;margin:22px 0 28px}.ax{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--mu);text-align:right;width:18px;margin:-6px 0}.ax span{line-height:12px}
.plot{position:relative;flex:1;border-left:1px solid var(--ln)}.gl{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ln)}.plot .cols{position:absolute;inset:0;height:auto;margin:0;padding:0 12px}.cols em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;font-weight:700;color:var(--tx)}
.cal td{height:48px;vertical-align:top;border:1px solid var(--ln);padding:3px;font-size:12px;cursor:pointer;min-width:110px}.cal td.t{width:60px;color:var(--mu);cursor:default;border-left:0}
.cal .bk{background:var(--soft);border-left:3px solid var(--blue);padding:4px 6px;border-radius:3px}.cal td:not(.t):not(.h):hover{background:var(--soft)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.note{background:var(--bg);border-radius:8px;padding:12px;margin-top:12px;font-size:13px}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:6px}.ph img,.ph span{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:22px;border:2px solid var(--ln)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);width:min(380px,92vw);padding:20px}dialog::backdrop{background:rgba(0,0,0,.45)}
a.l{color:var(--blue);cursor:pointer;font-size:12px;text-decoration:underline}
@media(max-width:760px){.app{flex-direction:column}aside{width:100%;display:flex;flex-direction:row;position:static;height:auto;overflow-x:auto;padding:8px;gap:4px}.acct{display:none}aside h1{display:none}aside a{white-space:nowrap;margin:0}main,.pg{padding:14px}.two,.two.e{grid-template-columns:1fr}.split .pan{display:none}.row.a{flex-direction:column}.tb{padding:10px 14px}}
</style></head><body>
<div id="r"></div><dialog id="m"></dialog><div class="toast" id="t"></div>
<script>
const $=s=>document.querySelector(s);
const SL=["09:00","10:00","11:00","13:00","14:00"],DN=["Mon","Tue","Wed","Thu","Fri"],WK=["2026-11-16","2026-11-17","2026-11-18","2026-11-19","2026-11-20"],TODAY="2026-11-16";
const SV=["Routine check-up","Routine cleaning","Filling","Check-up and X-ray","Tooth extraction","Consultation"],DR=["Dr. Maya Chen","Dr. Sam Lim","Dr. Leah"];
const lab=t=>{let[h,m]=t.split(":");h=+h;return (h>12?h-12:h)+":"+m},fd=d=>new Date(d+"T00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
let S={role:"",view:"welcome",tab:"in",fp:{step:1,email:""},photo:"",admin:{name:"Front Desk Staff",role:"Front desk",email:"frontdesk@dentacare.ph",phone:""},user:{name:"Sarah Collins",email:"sarah@email.com",dob:"",sex:"Female",phone:"",addr:""}},nid=10;
let appts=[{id:1,date:"2026-11-16",time:"09:00",pat:"Juan Dela Cruz",svc:"Routine check-up",dr:"Dr. Sam Lim",st:"Booked"},{id:2,date:"2026-11-17",time:"10:00",pat:"Mark Dizon",svc:"Filling",dr:"Dr. Leah",st:"Booked"},{id:3,date:"2026-11-18",time:"11:00",pat:"Sarah Collins",svc:"Routine check-up",dr:"Dr. Maya Chen",st:"Booked"},
{id:4,date:"2026-03-12",time:"09:00",pat:"Sarah Collins",svc:"Routine cleaning",dr:"Dr. Maya Chen",st:"Completed"},{id:5,date:"2025-09-03",time:"10:00",pat:"Sarah Collins",svc:"Check-up and X-ray",dr:"Dr. Maya Chen",st:"Completed"},{id:6,date:"2025-03-08",time:"11:00",pat:"Sarah Collins",svc:"Filling",dr:"Dr. Sam Lim",st:"Completed"}];
let q=[{n:"Juan Dela Cruz",s:"Routine check-up",d:"Dr. Sam Lim",st:"In chair"},{n:"Mark Dizon",s:"Filling",d:"Dr. Leah",st:"Waiting"},{n:"Walk-in",s:"Consultation",d:"Next available",st:"Waiting"}];
let rem=[{n:"Ana Reyes",m:"Appointment tomorrow 9:00",t:"SMS"},{n:"Leo Tan",m:"Six-month cleaning due",t:"Email"},{n:"Mia Cruz",m:"Follow-up after filling",t:"SMS"},{n:"Paolo Uy",m:"Appointment tomorrow 11:00",t:"SMS"},{n:"Eva Lim",m:"Appointment tomorrow 13:00",t:"Email"},{n:"Ben Sy",m:"Recall: annual X-ray",t:"SMS"}];
let SC={area:"",sym:["Toothache","Sensitivity"],custom:[],pain:5,dur:"",notes:"",res:null};
const SYM=["Toothache","Swollen gums","Sensitivity","Bleeding","Bad breath"];
const X={"Pain when chewing":["Cracked tooth",15],"Chipped tooth":["Cracked tooth",25],"Dark spots on tooth":["Cavity",20],"Sensitivity to sweets":["Cavity",20],"Loose tooth":["Gum inflammation",15],"Receding gums":["Gum inflammation",20],"Pus or abscess":["Other",15],"Swelling in face":["Other",10],"Jaw pain":["Other",15],"Mouth sores":["Other",20],"Dry mouth":["Other",15],"Fever":["Other",10]},MORE=Object.keys(X);
const A=[["dashboard","Dashboard"],["calendar","Calendar"],["queue","Patient Queue"],["reminders","Reminders"],["reports","Reports"],["profile","Profile"],["privacy","Privacy Notice"]];
const P=[["p-dashboard","Dashboard"],["p-appointments","Appointments"],["p-symptoms","Symptom Checker"]];
const ini=n=>n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const mine=()=>appts.filter(a=>a.pat==S.user.name),upc=()=>mine().filter(a=>a.st=="Booked").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const taken=(d,t,dr)=>appts.some(a=>a.st=="Booked"&&a.date==d&&a.time==t&&a.dr==dr);
const pill=s=>`<span class="pill ${{Done:"ok","In chair":"",Completed:"ok",Cancelled:"bad",High:"bad",Medium:"",Low:"ok"}[s]||""}">${s}</span>`;
function toast(m){const t=$("#t");t.textContent=m;t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",2400)}
function go(v){S.view=v;history.replaceState(null,"","#"+v);render();scrollTo(0,0)}
function modal(h){const m=$("#m");m.innerHTML=h;m.showModal()}function close_(){$("#m").close()}
function add(date,time,pat,svc,dr){appts.push({id:nid++,date,time,pat,svc,dr,st:"Booked"});rem.push({n:pat,m:"Appointment "+fd(date)+" "+lab(time),t:"SMS"})}
const shell=(c)=>S.role=="admin"?`<div class="app"><aside><h1>DENTACARE</h1>${A.map(([k,l])=>`<a class="${k==S.view?"on":""}" onclick="go('${k}')">${l}</a>`).join("")}<a onclick="logout()">Log out</a><div class="acct" title="My profile" onclick="go('profile')"><span class="pic" style="${S.photo?`background-image:url('${S.photo}')`:''}">${S.photo?'':ini(S.admin.name)}</span><div><b>${S.admin.name}</b><small>${S.admin.role}</small></div></div></aside><main>${c}</main></div>`
:`<div class="tb"><b>DENTACARE</b><nav>${P.map(([k,l])=>`<a class="${k==S.view?"on":""}" onclick="go('${k}')">${l}</a>`).join("")}<span class="av" title="My profile" onclick="go('p-profile')" style="${S.user.photo?`background:url('${S.user.photo}') center/cover`:''}">${S.user.photo?'':ini(S.user.name)}</span></nav></div><div class="pg">${c}</div>`;
function pickPhoto(i,w){const f=i.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Please choose an image');if(f.size>2097152)return toast('Image must be under 2 MB');const r=new FileReader();r.onload=()=>{if(w=="u")S.user.photo=r.result;else S.photo=r.result;toast('Photo updated');render()};r.readAsDataURL(f)}
function logout(){S.role="";go("welcome")}
const pan=`<div class="pan"></div>`;
const V={
welcome:()=>`<div class="split">${pan}<div class="ct"><div style="text-align:center"><h2 style="font-size:30px">Welcome to DentaCare!</h2><p class="sub">Select account type</p><div class="row" style="max-width:420px;margin:0 auto"><div class="card"><b>Admin Account</b><p class="sub">Front desk and dentists</p><button class="btn o f" onclick="S.role='admin';go('auth')">Open Admin</button></div><div class="card"><b>Patient Account</b><p class="sub">Book and track your care</p><button class="btn f" onclick="S.role='patient';go('auth')">Open Patient</button></div></div></div></div></div>`,
auth:()=>{const adm=S.role=="admin";return `<div class="split">${pan}<div class="ct"><div style="max-width:360px"><b style="font-size:24px">Sign in</b><p class="sub">Welcome to DentaCare! ${adm?"Staff":"Patient"} account</p><label>Email address</label><input id="se" type="email"><label>Password</label><input id="sp" type="password"><br><br><button class="btn f" onclick="signin()">Sign in</button><p style="text-align:center"><a class="l" onclick="forgot()">Forgot password?</a></p><p style="text-align:center" class="sub">No account yet? <a class="l" onclick="go('signup')">Create account</a></p><p style="text-align:center"><a class="l" onclick="S.role='';go('welcome')">← Back</a></p></div></div></div>`},
forgot:()=>`<div class="split">${pan}<div class="ct"><div style="max-width:360px"><b style="font-size:24px">Forgot password?</b>`+(S.fp.step==1?`<p class="sub">Enter your email and we’ll send a reset code.</p><label>Email address</label><input id="fe" type="email" value="${S.fp.email}"><br><br><button class="btn f" onclick="fpSend()">Send reset code</button>`:`<p class="sub">We sent a 6-digit code to ${S.fp.email}. (Demo: any 6 digits work.)</p><label>Reset code</label><input id="fc" inputmode="numeric" maxlength="6"><label>New password</label><input id="fw" type="password"><label>Confirm new password</label><input id="fx" type="password"><br><br><button class="btn f" onclick="fpReset()">Reset password</button><p style="text-align:center"><a class="l" onclick="S.fp.step=1;render()">Use a different email</a></p>`)+`<p style="text-align:center"><a class="l" onclick="go('auth')">← Back to sign in</a></p></div></div></div>`,
signup:()=>{const adm=S.role=="admin";return `<div class="split">${pan}<div class="ct"><div style="max-width:420px"><b style="font-size:24px">${adm?"Create staff account":"Create your account"}</b><p class="sub">${adm?"For front desk staff and dentists":"Book and track your care"}</p>`+(adm?`<label>Full name</label><input id="an"><div class="row"><div><label>Role</label><select id="ar"><option>Front desk</option><option>Dentist</option></select></div><div><label>Contact number</label><input id="ap"></div></div><label>Email address</label><input id="ae" type="email"><label>Clinic invite code</label><input id="ak" placeholder="Given by your clinic owner"><div class="row"><div><label>Password</label><input id="aw" type="password"></div><div><label>Confirm password</label><input id="ac" type="password"></div></div>`:`<label>Full name</label><input id="cn"><div class="row"><div><label>Date of birth</label><input id="cd" type="date"></div><div><label>Sex</label><select id="cs"><option>Female</option><option>Male</option></select></div></div><label>Contact number</label><input id="cp"><label>Address</label><input id="ca" placeholder="House/Unit No., Street, Barangay, City, Province"><label>Email address</label><input id="ce" type="email"><label>Password</label><input id="cw" type="password">`)+`<br><br><button class="btn f" onclick="signup()">Create account</button><p style="text-align:center" class="sub">Already have an account? <a class="l" onclick="go('auth')">Sign in</a></p></div></div></div>`},
dashboard:()=>{const td=appts.filter(a=>a.date==TODAY&&a.st=="Booked").length,nx=appts.filter(a=>a.st=="Booked"&&a.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);return `<h2>Front Desk</h2><p class="sub">Welcome back.</p><div class="grid"><div class="card">Today’s appointments<div class="big">${td}</div></div><div class="card">In queue<div class="big">${q.filter(x=>x.st!="Done").length}</div></div><div class="card">Reminders due<div class="big">${rem.length}</div></div><div class="card">Reports<div class="big">4</div></div></div><div class="card wrap"><b>Next up</b><table><tr><th>When</th><th>Patient</th><th>Dentist</th></tr>${nx.map(a=>`<tr><td>${fd(a.date)} ${lab(a.time)}</td><td>${a.pat}</td><td>${a.dr}</td></tr>`).join("")}</table></div>`},
calendar:()=>`<div class="top"><div><h2>Clinic calendar</h2><p class="sub">Week of Nov 16. Click an empty slot to book, or a booking to change it.</p></div><button class="btn cta" onclick="slotModal('','')">+ Book appointment</button></div><div class="card wrap"><table class="cal"><tr><th></th>${DN.map((d,i)=>`<th class="h">${d} ${WK[i].slice(8)}</th>`).join("")}</tr>${SL.map(t=>`<tr><td class="t">${lab(t)}</td>${WK.map(d=>{const b=appts.filter(a=>a.date==d&&a.time==t&&a.st=="Booked");return `<td onclick="${b.length?`bkModal(${b[0].id})`:`slotModal('${d}','${t}')`}">${b.length?b.map(x=>`<div class="bk">${x.pat}</div>`).join(""):'<span class="plus">+</span>'}</td>`}).join("")}</tr>`).join("")}</table></div>`,
queue:()=>`<div class="top"><div><h2>Patient Queue</h2><p class="sub">Today’s walk-ins and booked patients, in order.</p></div><button class="btn" onclick="walk()">+ Add walk-in</button></div><div class="card wrap"><table><tr><th>#</th><th>Patient</th><th>Service</th><th>Dentist</th><th>Status</th><th>Action</th></tr>${q.map((x,i)=>`<tr><td>${i+1}</td><td>${x.n}</td><td>${x.s}</td><td>${x.d}</td><td>${pill(x.st)}</td><td>${x.st=="Waiting"?`<button class="btn s" onclick="q[${i}].st='In chair';render()">Call in</button>`:x.st=="In chair"?`<button class="btn s o" onclick="q[${i}].st='Done';render()">Mark done</button>`:"—"}</td></tr>`).join("")}</table></div>`,
reminders:()=>`<div class="top"><div><h2>Reminders</h2><p class="sub">Send appointment and recall notices.</p></div><button class="btn o" onclick="rem=[];toast('All reminders sent');render()">Send all</button></div><div class="card wrap"><table><tr><th>Patient</th><th>Message</th><th>Channel</th><th></th></tr>${rem.map((x,i)=>`<tr><td>${x.n}</td><td>${x.m}</td><td>${x.t}</td><td><button class="btn s" onclick="toast('Sent to ${x.n}');rem.splice(${i},1);render()">Send</button></td></tr>`).join("")||'<tr><td colspan="4">All reminders sent.</td></tr>'}</table></div>`,
reports:()=>{const c=s=>appts.filter(a=>a.st==s).length;return `<h2>Reports</h2><p class="sub">Clinic activity.</p><div class="grid"><div class="card">Booked<div class="big">${c("Booked")}</div></div><div class="card">Completed<div class="big">${c("Completed")}</div></div><div class="card">Cancelled<div class="big">${c("Cancelled")}</div></div><div class="card">Queue today<div class="big">${q.length}</div></div></div><div class="two e"><div class="card"><b>Appointments per day</b><p class="sub" style="margin:2px 0 0">Number of booked appointments, Nov 16 to 20</p>${(()=>{const n=WK.map(d=>appts.filter(a=>a.date==d&&a.st=="Booked").length),m=Math.max(4,...n),t=[...Array(m+1).keys()];return `<div class="chart"><div class="ax">${t.slice().reverse().map(v=>`<span>${v}</span>`).join("")}</div><div class="plot">${t.map(v=>`<i class="gl" style="bottom:${v/m*100}%"></i>`).join("")}<div class="cols">${n.map((v,i)=>`<div style="height:${v/m*100}%"><em>${v}</em><span>${DN[i]}</span></div>`).join("")}</div></div></div>`})()}</div><div class="card"><b>Top services</b><br><br>${["Cleaning|38","Check-up|29","Filling|21","Other|12"].map(x=>{const[a,b]=x.split("|");return `${a} ${b}%<div class="bar"><i style="width:${b}%"></i></div>`}).join("")}</div></div><button class="btn o" onclick="toast('Report exported (demo)')">Export report</button>`},
profile:()=>`<h2>Profile</h2><p class="sub">Your staff account.</p><div class="card" style="max-width:520px"><div class="ph">${S.photo?`<img src="${S.photo}" alt="Profile photo">`:`<span>${ini(S.admin.name)}</span>`}<div><button class="btn s" onclick="$('#pf').click()">${S.photo?'Change photo':'Upload photo'}</button> ${S.photo?`<button class="btn s o" onclick="S.photo='';render()">Remove</button>`:''}<p class="sub" style="margin:6px 0 0">JPG or PNG, up to 2 MB.</p><input id="pf" type="file" accept="image/*" hidden onchange="pickPhoto(this)"></div></div><label>Full name</label><input value="${S.admin.name}"><label>Role</label><select><option ${S.admin.role=="Front desk"?"selected":""}>Front desk</option><option ${S.admin.role=="Dentist"?"selected":""}>Dentist</option></select><label>Contact number</label><input value="${S.admin.phone}"><label>Email</label><input value="${S.admin.email}"><label>New password</label><input type="password"><br><br><button class="btn" onclick="toast('Profile saved')">Save changes</button></div>`,
privacy:()=>`<h2>Privacy Notice</h2><p class="sub">How DentaCare handles patient data (Data Privacy Act of 2012).</p><div class="card" style="max-width:700px"><p><b>What we collect.</b> Name, contact details, date of birth, address, dental history and appointment records.</p><p><b>Why.</b> To schedule visits, send reminders and give safe dental care.</p><p><b>Who sees it.</b> Only authorized clinic staff and your assigned dentist.</p><p><b>Your rights.</b> Access, correct or request deletion of your data by contacting the clinic.</p><p><b>Symptom Checker.</b> Results are predictions only, not a diagnosis.</p></div>`,
"p-dashboard":()=>{const n=upc()[0],h=mine().filter(a=>a.st=="Completed").sort((a,b)=>b.date.localeCompare(a.date));return `<div class="top"><div><h2>Welcome ${S.user.name.split(" ")[0]}!</h2><p class="sub">Here is what is happening with your dental care</p></div><button class="btn cta" onclick="go('p-book')">+ Book appointment</button></div><div class="two"><div class="hero"><small>YOUR NEXT VISIT</small>${n?`<h3>${n.svc} with ${n.dr}</h3><p style="margin:-8px 0 14px;opacity:.85">${fd(n.date)} at ${lab(n.time)}</p><button class="btn w" onclick="bkInfo(${n.id})">View details</button> <button class="btn g" onclick="resched(${n.id})">Reschedule</button>`:`<h3>No upcoming visit</h3><button class="btn w" onclick="go('p-book')">Book one now</button>`}</div><div class="card"><b>Your care plan</b><p class="sub" style="margin:8px 0 4px">Annual care progress: 75%</p><div class="bar"><i style="width:75%"></i></div><span class="sub">Next: six-month cleaning</span></div></div><div class="card wrap"><div class="top"><b>Visit history</b><a class="l" onclick="go('p-appointments')">See all</a></div><table><tr><th>Date</th><th>Visit</th><th>Dentist</th></tr>${h.slice(0,3).map(a=>`<tr><td>${fd(a.date)}</td><td>${a.svc}</td><td>${a.dr}</td></tr>`).join("")||'<tr><td colspan="3">No visits yet.</td></tr>'}</table></div>`},
"p-appointments":()=>`<div class="top"><div><h2>My Appointments</h2><p class="sub">Upcoming and past visits.</p></div><button class="btn cta" onclick="go('p-book')">+ Book appointment</button></div><div class="card wrap"><table><tr><th>Date</th><th>Service</th><th>Dentist</th><th>Status</th><th></th></tr>${mine().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(a=>`<tr><td>${fd(a.date)} ${lab(a.time)}</td><td>${a.svc}</td><td>${a.dr}</td><td>${pill(a.st)}</td><td>${a.st=="Booked"?`<button class="btn s o" onclick="resched(${a.id})">Reschedule</button> <button class="btn s o" onclick="cancel(${a.id})">Cancel</button>`:""}</td></tr>`).join("")||'<tr><td colspan="5">No appointments yet.</td></tr>'}</table></div>`,
"p-book":()=>`<h2>Book an appointment</h2><p class="sub">Pick a dentist and a time that works for you</p><div class="card" style="max-width:520px"><label>Service</label><select id="bs">${SV.map(x=>`<option>${x}</option>`).join("")}</select><label>Dentist</label><select id="bd" onchange="slots()">${DR.map(x=>`<option>${x}</option>`).join("")}</select><div class="row"><div><label>Preferred date</label><input id="bt" type="date" min="${TODAY}" onchange="slots()"></div><div><label>Preferred time</label><select id="bm"><option value="">Pick a date first</option></select></div></div><label>Additional notes</label><textarea id="bn" rows="4"></textarea><br><br><button class="btn cta f" onclick="book()">Confirm appointment</button></div>`,
"p-symptoms":()=>{const all=[...SYM,...SC.custom],r=SC.res;return `<h2>Symptom Checker</h2><p class="sub">Describe how you feel to get a predicted result. This is NOT a diagnosis.</p><div class="two e"><div class="card"><b>1. Your symptoms</b><label>Select area</label><input value="${SC.area}" oninput="SC.area=this.value" placeholder="Upper left, lower right, gums..."><label>Symptoms</label><div class="chips">${all.map(s=>`<button class="chip ${SC.sym.includes(s)?"on":""}" onclick="tog('${s}')">${s}</button>`).join("")}<button class="chip" onclick="addSym()">+ Add</button></div><label>Pain level (1 to 10): <b id="pv">${SC.pain}</b></label><input type="range" min="1" max="10" value="${SC.pain}" oninput="SC.pain=+this.value;$('#pv').textContent=this.value"><label>How long</label><select onchange="SC.dur=this.value"><option value="">Select duration</option>${["Less than a day","1 to 3 days","4 to 7 days","More than a week"].map(x=>`<option ${SC.dur==x?"selected":""}>${x}</option>`).join("")}</select><label>Additional notes</label><textarea rows="3" oninput="SC.notes=this.value">${SC.notes}</textarea><br><br><button class="btn f" onclick="predict()">Run prediction</button></div>
<div class="card"><b>2. Predicted result</b>${r?`<div class="top" style="margin-top:12px"><div><b>URGENCY</b><p class="sub">${r.win}</p></div>${pill(r.urg)}</div><b style="font-size:12px">POSSIBLE CONDITIONS</b><br><br>${r.c.map(([n,p])=>`${n} ${p}%<div class="bar"><i style="width:${p}%"></i></div>`).join("")}<div class="note"><b>Suggested next step</b><br>${r.step}</div><br><button class="btn" onclick="go('p-book')">Book appointment</button> <button class="btn o" onclick="SC={area:'',sym:[],custom:[],pain:5,dur:'',notes:'',res:null};render()">Start over</button>`:`<p class="sub" style="margin-top:12px">Choose your symptoms and run the prediction to see results here.</p>`}</div></div>`},
"p-profile":()=>{const u=S.user;return `<h2>My Profile</h2><p class="sub">Keep your details up to date.</p><div class="card" style="max-width:520px"><div class="ph">${u.photo?`<img src="${u.photo}" alt="Profile photo">`:`<span>${ini(u.name)}</span>`}<div><button class="btn s" onclick="$('#pf').click()">${u.photo?'Change photo':'Upload photo'}</button> ${u.photo?`<button class="btn s o" onclick="S.user.photo='';render()">Remove</button>`:''}<p class="sub" style="margin:6px 0 0">JPG or PNG, up to 2 MB.</p><input id="pf" type="file" accept="image/*" hidden onchange="pickPhoto(this,'u')"></div></div><label>Full name</label><input id="un" value="${u.name}"><div class="row"><div><label>Date of birth</label><input id="ud" type="date" value="${u.dob}"></div><div><label>Sex</label><select id="us"><option ${u.sex=="Female"?"selected":""}>Female</option><option ${u.sex=="Male"?"selected":""}>Male</option></select></div></div><label>Contact number</label><input id="up" value="${u.phone}"><label>Address</label><input id="ua" value="${u.addr}" placeholder="House/Unit No., Street, Barangay, City, Province"><label>Email</label><input id="ue" value="${u.email}"><br><br><button class="btn" onclick="saveP()">Save changes</button> <button class="btn o" onclick="logout()">Log out</button></div>`}
};
function signin(){const e=$("#se").value.trim(),p=$("#sp").value;if(!e||!p)return toast("Enter your email and password");if(S.role=="patient")S.user.email=e;go(S.role=="admin"?"dashboard":"p-dashboard")}
function signupA(){const f=id=>$("#"+id).value.trim();if(!f("an")||!f("ap")||!f("ae")||!f("ak")||!f("aw"))return toast("Please fill in every field");if(f("aw").length<6)return toast("Password needs 6+ characters");if(f("aw")!=f("ac"))return toast("Passwords do not match");S.admin={name:f("an"),role:$("#ar").value,email:f("ae"),phone:f("ap")};toast("Staff account created");go("dashboard")}
function forgot(){S.fp={step:1,email:($("#se")||{value:""}).value.trim()};go("forgot")}
function fpSend(){const e=$("#fe").value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return toast("Enter a valid email");S.fp={step:2,email:e};toast("Reset code sent");render()}
function fpReset(){const c=$("#fc").value.trim(),w=$("#fw").value;if(!/^\d{6}$/.test(c))return toast("Enter the 6-digit code");if(w.length<6)return toast("Password needs 6+ characters");if(w!=$("#fx").value)return toast("Passwords do not match");S.fp={step:1,email:""};toast("Password updated. Please sign in.");go("auth")}
function signup(){if(S.role=="admin")return signupA();const f=id=>$("#"+id).value.trim(),n=f("cn");if(!n||!f("cd")||!f("cp")||!f("ca")||!f("ce")||!f("cw"))return toast("Please fill in every field");if(f("cw").length<6)return toast("Password needs 6+ characters");S.user={name:n,email:f("ce"),dob:f("cd"),sex:$("#cs").value,phone:f("cp"),addr:f("ca")};toast("Account created");go("p-dashboard")}
function saveP(){const o=S.user.name,n=$("#un").value.trim()||o;appts.forEach(a=>{if(a.pat==o)a.pat=n});S.user={photo:S.user.photo||"",name:n,email:$("#ue").value,dob:$("#ud").value,sex:$("#us").value,phone:$("#up").value,addr:$("#ua").value};toast("Profile saved");render()}
function slots(){const d=$("#bt").value,dr=$("#bd").value,s=$("#bm");if(!d)return;const w=new Date(d+"T00:00").getDay();if(w==0||w==6){s.innerHTML='<option value="">Clinic is closed on weekends</option>';return}s.innerHTML='<option value="">Select time</option>'+SL.map(t=>`<option value="${t}" ${taken(d,t,dr)?"disabled":""}>${lab(t)}${taken(d,t,dr)?" (taken)":""}</option>`).join("")}
function book(){const d=$("#bt").value,t=$("#bm").value;if(!d||!t)return toast("Pick a date and an open time");add(d,t,S.user.name,$("#bs").value,$("#bd").value);toast("Appointment confirmed");go("p-appointments")}
function cancel(id){if(confirm("Cancel this appointment?")){appts.find(a=>a.id==id).st="Cancelled";render()}}
function bkInfo(id){const a=appts.find(x=>x.id==id);modal(`<b>${a.svc}</b><p>${a.dr}<br>${fd(a.date)} at ${lab(a.time)}</p><button class="btn o" onclick="close_()">Close</button>`)}
function resched(id){const a=appts.find(x=>x.id==id);modal(`<b>Reschedule</b><label>New date</label><input id="rd" type="date" min="${TODAY}" value="${a.date}"><label>New time</label><select id="rt">${SL.map(t=>`<option value="${t}">${lab(t)}</option>`).join("")}</select><br><br><button class="btn" onclick="doRes(${id})">Save</button> <button class="btn o" onclick="close_()">Close</button>`)}
function doRes(id){const a=appts.find(x=>x.id==id),d=$("#rd").value,t=$("#rt").value,w=new Date(d+"T00:00").getDay();if(!d||w==0||w==6)return toast("Pick a weekday");if(taken(d,t,a.dr))return toast("That slot is taken");a.date=d;a.time=t;close_();toast("Rescheduled");render()}
function slotModal(d,t){modal(`<b>Book appointment</b><label>Patient name</label><input id="pn"><label>Service</label><select id="ps">${SV.map(x=>`<option>${x}</option>`).join("")}</select><label>Dentist</label><select id="pd">${DR.map(x=>`<option>${x}</option>`).join("")}</select><div class="row"><div><label>Day</label><select id="pw">${WK.map((x,i)=>`<option value="${x}" ${x==d?"selected":""}>${DN[i]} ${x.slice(8)}</option>`).join("")}</select></div><div><label>Time</label><select id="pt">${SL.map(x=>`<option value="${x}" ${x==t?"selected":""}>${lab(x)}</option>`).join("")}</select></div></div><br><button class="btn" onclick="slotBook()">Book</button> <button class="btn o" onclick="close_()">Close</button>`)}
function slotBook(){const n=$("#pn").value.trim(),d=$("#pw").value,t=$("#pt").value,dr=$("#pd").value;if(!n)return toast("Enter the patient name");if(taken(d,t,dr))return toast(dr+" is already booked then");add(d,t,n,$("#ps").value,dr);close_();toast("Booked");render()}
function bkModal(id){const a=appts.find(x=>x.id==id);modal(`<b>${a.pat}</b><p>${a.svc}<br>${a.dr}<br>${fd(a.date)} at ${lab(a.time)}</p><button class="btn" onclick="checkIn(${id})">Check in</button> <button class="btn o" onclick="appts.find(x=>x.id==${id}).st='Cancelled';close_();render()">Cancel booking</button> <button class="btn o" onclick="close_()">Close</button>`)}
function checkIn(id){const a=appts.find(x=>x.id==id);q.push({n:a.pat,s:a.svc,d:a.dr,st:"Waiting"});close_();toast("Added to queue")}
function walk(){modal(`<b>Add walk-in</b><label>Patient name</label><input id="wn"><label>Service</label><select id="ws">${SV.map(x=>`<option>${x}</option>`).join("")}</select><br><br><button class="btn" onclick="const n=$('#wn').value.trim();if(!n)return toast('Enter a name');q.push({n,s:$('#ws').value,d:'Next available',st:'Waiting'});close_();render()">Add</button> <button class="btn o" onclick="close_()">Close</button>`)}
function tog(s){SC.sym=SC.sym.includes(s)?SC.sym.filter(x=>x!=s):[...SC.sym,s];render()}
function addSym(){const ex=MORE.filter(x=>!SC.custom.includes(x));modal(`<b>Add a symptom</b><p class="sub">Pick from the menu, or type your own below.</p><div class="chips" id="mc">${ex.map(x=>`<button class="chip" onclick="this.classList.toggle('on')">${x}</button>`).join("")||'<span class="sub">All menu symptoms are added.</span>'}</div><label>Other</label><input id="mo" placeholder="Type another symptom"><br><br><button class="btn" onclick="applySym()">Add selected</button> <button class="btn o" onclick="close_()">Close</button>`)}
function applySym(){const l=[...document.querySelectorAll('#mc .chip.on')].map(b=>b.textContent),o=$('#mo').value.replace(/['"<>\\]/g,'').trim();if(o)l.push(o);if(!l.length)return toast('Choose a symptom first');l.forEach(s=>{if(!SYM.includes(s)&&!SC.custom.includes(s))SC.custom.push(s);if(!SC.sym.includes(s))SC.sym.push(s)});close_();render()}
function predict(){if(!SC.sym.length)return toast("Pick at least one symptom");if(!SC.dur)return toast("Select how long");const c={Cavity:10,"Gum inflammation":10,"Cracked tooth":5,Other:8},h=s=>SC.sym.includes(s),n=SC.notes.toLowerCase();
if(h("Toothache")){c.Cavity+=25;c["Cracked tooth"]+=15}if(h("Sensitivity")){c.Cavity+=25;c["Cracked tooth"]+=20}if(h("Swollen gums"))c["Gum inflammation"]+=35;if(h("Bleeding"))c["Gum inflammation"]+=30;if(h("Bad breath")){c["Gum inflammation"]+=15;c.Cavity+=10;c.Other+=5}
SC.sym.filter(s=>!SYM.includes(s)).forEach(s=>{const x=X[s];if(x)c[x[0]]+=x[1];else c.Other+=10});if(SC.pain>=7){c["Cracked tooth"]+=10;c.Cavity+=5}if(/bite|chew/.test(n))c["Cracked tooth"]+=20;if(/gum/i.test(SC.area))c["Gum inflammation"]+=15;
const t=Object.values(c).reduce((a,b)=>a+b,0);let l=Object.entries(c).map(([k,v])=>[k,Math.round(v/t*100)]).sort((a,b)=>b[1]-a[1]);l[0][1]+=100-l.reduce((a,b)=>a+b[1],0);
const di=["Less than a day","1 to 3 days","4 to 7 days","More than a week"].indexOf(SC.dur),sc=SC.pain+di+(h("Bleeding")?1:0)+(h("Swollen gums")?2:0)+(h("Swelling in face")?3:0)+(h("Pus or abscess")?3:0),urg=sc>=12?"High":sc>=8?"Medium":"Low",win={High:"Book within 24 hours",Medium:"Book within 3 days",Low:"Book within 2 weeks"}[urg];
const st={Cavity:"Book a dental exam and avoid very hot or cold food until then.","Gum inflammation":"Brush gently, floss daily and book a cleaning and gum check.","Cracked tooth":"Avoid chewing on that side and book an exam soon.",Other:"Book a consultation so a dentist can look at it."}[l[0][0]];
const OT={"Pus or abscess":"dental abscess (infection)","Swelling in face":"possible infection","Fever":"possible infection","Jaw pain":"jaw joint (TMJ) problem","Mouth sores":"mouth ulcers","Dry mouth":"dry mouth (low saliva)"},on=[...new Set(SC.sym.filter(s=>!SYM.includes(s)).map(s=>OT[s]||s.toLowerCase()))],ol="Other: "+(on.length?on.slice(0,2).join(", "):h("Bad breath")?"plaque or tartar buildup":"tooth wear or bite problem");
SC.res={c:l.map(([k,v])=>[k=="Other"?ol:k,v]),urg,win,step:st+(urg=="High"?" If you have swelling in your face or trouble breathing, go to the emergency room.":"")};render()}
function render(){$("#r").innerHTML=["welcome","auth","signup","forgot"].includes(S.view)?V[S.view]():V[S.view]?shell(V[S.view]()):(go("welcome"),"");if(S.view=="p-book"&&$("#bt"))$("#bt").value=""}
const h0=location.hash.slice(1);render();
</script></body></html>
